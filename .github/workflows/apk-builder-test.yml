name: APK builder test

# 서버의 APK 빌더(server/apk.ts)가 실제로 Expo 앱을 빌드하는지 확인합니다.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install server packages
        working-directory: server
        run: npm ci

      - name: Build sample app with the server builder
        working-directory: server
        env:
          DATA_DIR: ${{ runner.temp }}/apk-smoke
        run: npx tsx ../.github/scripts/apk-smoke.mts

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sample-apk
          path: ${{ runner.temp }}/apk-smoke/builds/app/android/app/build/outputs/apk/release/app-release.apk
