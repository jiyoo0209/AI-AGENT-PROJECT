name: Smoke test APK

# 에뮬레이터용(x86_64) APK를 빌드해 실행하고, 시작 직후 오류가 없는지 로그로 확인합니다.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-

      - name: Build x86_64 release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write test script
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk app.apk
          cat > run.sh <<'SH'
          set -x
          adb install -r app.apk
          adb logcat -c
          adb shell monkey -p com.jiyoo0209.aiagentproject -c android.intent.category.LAUNCHER 1
          sleep 40
          adb shell pidof com.jiyoo0209.aiagentproject && echo "APP_ALIVE" || echo "APP_DEAD"
          adb exec-out screencap -p > screen.png
          adb logcat -d > logcat.txt
          SH

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash run.sh

      - name: Show app log
        if: always()
        run: |
          grep -E " E AndroidRuntime| F DEBUG|ReactNativeJS|unknown:ReactNative" logcat.txt | cut -c1-400 | head -150 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke
          path: |
            logcat.txt
            screen.png
